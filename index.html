<!DOCTYPE html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onde nos presentamos · Galicia 2027 · visor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161a; --panel:#1b1f25; --panel2:#22272f; --line:#2f3641;
  --tx:#e7eaee; --tx2:#8f98a5; --tx3:#5f6875;
  --sans:'Archivo',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#333c48;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.app{display:grid;grid-template-columns:1fr 320px;grid-template-rows:auto 1fr;height:100dvh}

header{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-weight:800;letter-spacing:-.02em;font-size:15px}
.brand span{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.regleta{flex:1;min-width:120px;display:flex;height:26px;border-radius:3px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.regleta div{transition:flex-grow .35s cubic-bezier(.2,.7,.3,1);position:relative}
.regleta div span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;font-weight:600;opacity:0;transition:opacity .2s}
.regleta div[data-w="1"] span{opacity:.9}
.saved{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.05em;white-space:nowrap;min-width:76px;text-align:right}
.saved.on{color:#22d3a5}
.reload{color:var(--tx3);font-size:15px;width:26px;height:26px;border:1px solid var(--line);border-radius:4px;flex:none}
.reload:hover{color:var(--tx);background:var(--panel2)}
.reload.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.stage{position:relative;overflow:hidden;background:radial-gradient(circle at 38% 30%,#1c2129 0%,#131519 70%)}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
svg#map.panning{cursor:grabbing}
#map path.mun{stroke:#39414d;stroke-width:.4;fill:#262c35;vector-effect:non-scaling-stroke}
#map path.mun:hover{stroke:#fff;stroke-width:1.3}
#map path.mun.sel{stroke:#fff;stroke-width:1.7}
#map path.mun.off{opacity:.22}
#map #bord{fill:none;stroke:#7d8furl;stroke:#818b99;stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.75}
#map .lbl{font-family:var(--sans);font-weight:600;fill:#fff;paint-order:stroke;
  stroke:#0d0f12;stroke-width:2.4px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
#map .klbl{font-family:var(--mono);fill:#aab3c0;text-anchor:middle;pointer-events:none;
  letter-spacing:.12em;paint-order:stroke;stroke:#0d0f12cc;stroke-width:3px;stroke-linejoin:round}

.tip{position:absolute;pointer-events:none;background:#0d0f12;border:1px solid var(--line);
  padding:5px 9px;border-radius:4px;font-size:12px;white-space:nowrap;opacity:0;transform:translate(-50%,-140%);
  transition:opacity .1s;z-index:5;box-shadow:0 6px 20px #0009}
.tip b{font-weight:600}
.tip i{font-style:normal;color:var(--tx3);font-family:var(--mono);font-size:10px;display:block;margin-top:2px}

.zoomctl{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:1px;
  background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.zoomctl button{width:30px;height:28px;color:var(--tx2);font-size:15px;line-height:1}
.zoomctl button:hover{background:var(--panel2);color:var(--tx)}
.zoomctl button.on{color:var(--tx);background:var(--panel2)}
.hint2{display:none;position:absolute;left:50px;bottom:14px;right:8px;
  font-family:var(--mono);font-size:9.5px;line-height:1.35;color:var(--tx3)}
.hint{position:absolute;left:52px;bottom:16px;font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.03em}

.palette{position:absolute;left:12px;top:12px;background:rgba(20,22,26,.93);border:1px solid var(--line);
  border-radius:5px;padding:7px;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(6px);min-width:216px}
.palette h4{margin:1px 4px 6px;font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.12em;
  text-transform:uppercase;color:var(--tx3)}
.brush{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:4px;text-align:left;width:100%}
.brush:hover{background:#ffffff0d}
.brush.on{background:#ffffff14}
.brush .sw{width:13px;height:13px;border-radius:3px;flex:none;border:1px solid #ffffff30}
.brush .nm{flex:1;font-size:12.5px}
.brush .ct{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.brush.on .ct{color:var(--tx)}
.brush kbd{font-family:var(--mono);font-size:9px;color:var(--tx3);border:1px solid var(--line);
  border-radius:3px;padding:0 3px;line-height:14px}
.layers{display:flex;flex-wrap:wrap;gap:3px;margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.layers button{flex:1 1 44%;font-size:10.5px;padding:4px 2px;border:1px solid var(--line);border-radius:3px;color:var(--tx3)}
.layers button:hover{color:var(--tx)}
.layers button.on{background:#ffffff14;color:var(--tx);border-color:#4a5563}

aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:9px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  font-family:var(--mono);color:var(--tx3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--tx);border-bottom-color:#ff3d7f}
.pane{flex:1;overflow-y:auto;min-height:0;display:none}
.pane.on{display:block}

.search{padding:9px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;flex:none}
.search input{flex:1;min-width:100px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 9px;outline:none}
.search input:focus{border-color:#4a5563}
.search select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 4px;outline:none}

.row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #ffffff08;cursor:pointer;width:100%;text-align:left}
.row:hover{background:#ffffff0a}
.row.sel{background:#ffffff14}
.row .dot{width:8px;height:8px;border-radius:2px;flex:none}
.row .nm{flex:1;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{font-family:var(--mono);font-size:9.5px;color:var(--tx3)}
.row .note{color:var(--tx3);font-size:11px}
.group{padding:11px 10px 4px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);
  display:flex;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--panel);z-index:1}
.group b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.detail{border-top:1px solid var(--line);padding:11px;flex:none;background:var(--panel2)}
.detail .who{font-weight:600;font-size:15px;letter-spacing:-.01em}
.detail .meta{font-family:var(--mono);font-size:10px;color:var(--tx3);margin-top:3px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:9px 0}
.chip{font-size:11px;padding:3px 8px;border-radius:11px;border:1px solid var(--line);color:var(--tx2)}
.chip:hover{border-color:#4a5563;color:var(--tx)}
.chip.on{color:#0d0f12;font-weight:600;border-color:transparent}
.detail textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px;
  resize:vertical;min-height:52px;outline:none;font-size:12.5px;line-height:1.45}
.detail textarea:focus{border-color:#4a5563}
.empty{padding:11px;color:var(--tx3);font-size:12px;line-height:1.5}

.tools{padding:11px;display:flex;flex-direction:column;gap:7px}
.tools button.act{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:8px 10px;text-align:left;font-size:12.5px}
.tools button.act:hover{border-color:#4a5563;background:#2a313a}
.tools p{margin:2px 0 8px;color:var(--tx3);font-size:11.5px;line-height:1.5}
.tools h5{margin:9px 0 2px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.danger:hover{border-color:#ff3d7f !important;color:#ff3d7f}

/* asa do panel inferior (só en móbil) */
.grip{display:none}

/* paleta pregada: só a fila de cores */
.ptog{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:4px;
  color:var(--tx3);font-size:11px;line-height:1}
.ptog:hover{background:#ffffff14;color:var(--tx)}
.palette.mini{flex-direction:row;align-items:center;gap:1px;min-width:0;padding:5px 26px 5px 5px}
.palette.mini h4,.palette.mini .layers,.palette.mini .brush .nm,
.palette.mini .brush .ct,.palette.mini .brush kbd{display:none}
.palette.mini .brush{padding:5px}
.palette.mini .sw{width:16px;height:16px}
.palette:not(.mini) .ptog{top:4px;right:4px}

@media(max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  aside{border-left:none;border-top:1px solid var(--line);
    height:var(--sheet,44dvh);max-height:88dvh;min-height:42px}
  .grip{display:block;flex:none;padding:7px 0 5px;cursor:ns-resize;touch-action:none;
    background:var(--panel);border-bottom:1px solid #ffffff08}
  .grip::before{content:'';display:block;width:38px;height:4px;border-radius:4px;
    background:#4a5563;margin:0 auto}
  .grip:active::before{background:#7a8697}
  .regleta{display:none}
  .palette{left:8px;top:8px}
  .hint{display:none}
  .hint2{display:block}
  .zoomctl{bottom:8px;left:8px}
  .search{padding:7px}
  .detail{padding:9px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><b>Onde nos presentamos</b><span>Galicia · municipais 2027</span></div>
  <div class="regleta" id="regleta"></div>
  <div class="saved" id="saved"></div>
  <button class="reload" id="reload" title="Volver cargar os datos">⟳</button>
</header>

<div class="stage" id="stage">
  <svg id="map"><g id="gmun"></g><path id="bord"></path><g id="glbl"></g></svg>
  <div class="tip" id="tip"></div>
  <div class="palette" id="palette"><h4>Estado</h4></div>
  <div class="zoomctl">
    <button id="zin" title="Achegar">+</button>
    <button id="zout" title="Afastar">−</button>
    <button id="zfit" title="Ver toda Galicia">⤢</button>
  </div>
  <div class="hint">Arrastra para mover · roda para o zoom · pincha nun concello para ver en que punto está</div>
  <div class="hint2">Arrastra para mover · pinza para o zoom</div>
</div>

<aside>
  <div class="grip" id="grip" title="Arrastra para cambiar o alto; toca para pregar"></div>
  <div class="tabs">
    <button class="on" data-tab="lista">Concellos</button>
  </div>

  <div class="pane on" id="pane-lista" style="display:flex;flex-direction:column">
    <div class="search">
      <input id="q" placeholder="Buscar concello…" autocomplete="off">
      <select id="fter"></select>
      <select id="agrup">
        <option value="estado">Agrupar por estado</option>
        <option value="deputados">Agrupar por demarcación</option>
        <option value="comarca">Agrupar por comarca</option>
        <option value="xudicial">Agrupar por partido xudicial</option>
      </select>
    </div>
    <div style="flex:1;overflow-y:auto;min-height:0" id="list"></div>
    <div id="detail"></div>
  </div>

</aside>
</div>

    const st = state[m.id];
    if (!all && !(st && st.s)) continue;
    if (!visible(m.c[0], m.c[1])) continue;
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', m.c[0]); t.setAttribute('y', m.c[1]);
    t.setAttribute('class','lbl');
    t.setAttribute('font-size', size);
    t.setAttribute('stroke-width', 2.4/z + 'px');
    t.textContent = m.n;
    glbl.appendChild(t);
  }
}

function refresh(id){

let drag = null, painting = false, moved = false, spaceDown = false, lastPainted = null;
let touchPaint = false;            // táctil: false = un dedo move o mapa, true = un dedo pinta
const pts = new Map();             // punteiros activos (para a pinza)
let pinch = null;
const TAP = 9;                     // tolerancia en px para considerar que foi un toque

const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const mid  = (a,b) => ({x:(a.x+b.x)/2, y:(a.y+b.y)/2});
function toSvg(cx, cy){
  const r = rectOf(svg);
  return {x: view.x + (cx-r.left)/r.width*view.w, y: view.y + (cy-r.top)/r.height*view.h};
}

svg.addEventListener('pointerdown', ev=>{
  pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  try { svg.setPointerCapture(ev.pointerId); } catch(e) {}
  tip.style.opacity = 0;

  if (pts.size === 2){                       // dous dedos: zoom e desprazamento
    const [a,b] = [...pts.values()];
    const m = mid(a,b), c = toSvg(m.x, m.y);
    pinch = {d: dist(a,b) || 1, w: view.w, h: view.h, cx: c.x, cy: c.y};
    drag = null; painting = false; lastPainted = null;
    svg.classList.remove('panning');
    return;
  }
  if (pts.size > 2) return;

  const touch = ev.pointerType === 'touch';
  const id = ev.target.dataset?.id;
  const wantPan = true;
  moved = false;
  if (wantPan){
    drag = {sx:ev.clientX, sy:ev.clientY, vx:view.x, vy:view.y, tapId: id};
    svg.classList.add('panning');
  }
});

svg.addEventListener('pointermove', ev=>{
  if (pts.has(ev.pointerId)) pts.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});

  if (pinch && pts.size >= 2){
    const [a,b] = [...pts.values()];
    const d = dist(a,b) || 1;
    const w = Math.min(base.w*1.2, Math.max(base.w/40, pinch.w * pinch.d / d));
    view.h = pinch.h * (w / pinch.w);
    view.w = w;
    const m = mid(a,b), r = rectOf(svg);
    view.x = pinch.cx - (m.x - r.left)/r.width*view.w;
    view.y = pinch.cy - (m.y - r.top)/r.height*view.h;
    applyView();
    return;
  }

  if (drag){
    const r = rectOf(svg);
    const dx = ev.clientX-drag.sx, dy = ev.clientY-drag.sy;
    view.x = drag.vx - dx/r.width*view.w;
    view.y = drag.vy - dy/r.height*view.h;
    applyView();
    if (Math.hypot(dx, dy) > TAP) moved = true;
    return;
  }

  const id = ev.target.dataset?.id;
  if (painting){
    return;
  }
  if (ev.pointerType === 'touch') return;    // sen tooltip co dedo
  if (id){
    const m = MUN[id], st = state[id];
    const ter = layer === 'j' ? 'P.X. '+PXU[m.j].n : (layer === 'e' ? 'Dem. '+DEP[m.e].n : KOM[m.k].n);
    tip.innerHTML = `<b>${m.n}</b><i>${ter}${st&&st.s?' · '+CAT[st.s].n:''}</i>`;
    const r = stage.getBoundingClientRect();
    tip.style.left = (ev.clientX - r.left)+'px';
    tip.style.top = (ev.clientY - r.top)+'px';
    tip.style.opacity = 1;
  } else tip.style.opacity = 0;
});

function endGesture(ev){
  const wasDrag = drag, wasPainting = painting, wasMoved = moved;
  if (ev && pts.has(ev.pointerId)) pts.delete(ev.pointerId);
  if (pts.size < 2) pinch = null;
  drag = null; painting = false; lastPainted = null;
  svg.classList.remove('panning');
  if (pts.size > 0) return;                  // aínda queda algún dedo na pantalla
  if (wasPainting && wasMoved){ renderList(); renderDetail(); drawLabels(); }
  if (wasDrag && !wasMoved && wasDrag.tapId) select(wasDrag.tapId);
}
addEventListener('pointerup', endGesture);
addEventListener('pointercancel', endGesture);

svg.addEventListener('pointerleave', ()=>{ tip.style.opacity=0; });

let terFilter = '';
function inFilter(m){
  if (!terFilter) return true;
  const [t,v] = [terFilter.slice(0,1), terFilter.slice(2)];
  return t==='p' ? m.p===v : (t==='j' ? m.j===v : (t==='e' ? m.e===v : m.k===v));
}

const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const agEl = document.getElementById('agrup');
qEl.oninput = renderList;
agEl.onchange = renderList;
fter.onchange = ()=>{
  terFilter = fter.value;
  for (const m of DATA.m) paths[m.id].classList.toggle('off', !!terFilter && !inFilter(m));
  renderList();
  if (terFilter.startsWith('k:')) flyToGroup('k', terFilter.slice(2));
  else if (terFilter.startsWith('j:')) flyToGroup('j', terFilter.slice(2));
  else if (terFilter.startsWith('e:')) flyToGroup('e', terFilter.slice(2));
  else if (!terFilter) fitView();
};
function flyToGroup(field, k){
  const ms = DATA.m.filter(m=>m[field]===k);
  const xs = ms.map(m=>m.c[0]), ys = ms.map(m=>m.c[1]);
  const w = Math.max(...xs)-Math.min(...xs)+90, h = Math.max(...ys)-Math.min(...ys)+90;
  const ar = base.w/base.h;
  let W2 = w, H2 = h;
  if (W2/H2 > ar) H2 = W2/ar; else W2 = H2*ar;
  view = {x:(Math.min(...xs)+Math.max(...xs))/2 - W2/2, y:(Math.min(...ys)+Math.max(...ys))/2 - H2/2, w:W2, h:H2};
  applyView();
}

function norm(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

function renderList(){
  const q = norm(qEl.value.trim());
  const items = DATA.m.filter(m => (!q || norm(m.n).includes(q)) && inFilter(m));
  listEl.textContent = '';
  const rowOf = (m)=>{
    const k = state[m.id]?.s || '';
    const b = document.createElement('button');
    b.className = 'row' + (m.id===selected?' sel':'');
    b.innerHTML = `<span class="dot" style="background:${k?CAT[k].c:'#39414d'}"></span>
      <span class="nm">${m.n}</span>${state[m.id]?.t?'<span class="note">✎</span>':''}
      <span class="pv">${agEl.value==='comarca' ? (k?CAT[k].n.slice(0,4).toUpperCase():'—') : KOM[m.k].n.slice(0,10).toUpperCase()}</span>`;
    b.onclick = ()=>{ select(m.id); flyTo(m.id); };
    return b;
  };
  const head = (label, color, n, extra)=>{
    const h = document.createElement('div');
    h.className = 'group';
    h.innerHTML = `<b style="color:${color}">${label}</b><span>${extra||''}${n}</span>`;
    listEl.appendChild(h);
  };
  if (agEl.value !== 'estado'){
    const field = {comarca:'k', xudicial:'j', deputados:'e'}[agEl.value];
    for (const c of (field === 'k' ? DATA.k : (field === 'j' ? DATA.j : DATA.e))){
      const grp = items.filter(m => m[field]===c.k);
      if (!grp.length) continue;
      const marc = grp.filter(m=>state[m.id]?.s).length;
      head(c.n, 'var(--tx2)', grp.length, marc+' / ');
      grp.forEach(m=>listEl.appendChild(rowOf(m)));
    }
  } else {
    for (const k of [...CATS.map(c=>c.k), '']){
      const grp = items.filter(m => (state[m.id]?.s||'') === k);
      if (!grp.length) continue;
      head(k?CAT[k].n:'Sen decidir', k?CAT[k].c:'var(--tx3)', grp.length);
      grp.forEach(m=>listEl.appendChild(rowOf(m)));
    }
  }
  if (!listEl.children.length) listEl.innerHTML = '<div class="empty">Ningún concello con ese nome. Proba con menos letras.</div>';
}

function flyTo(id){
  const m = MUN[id];
  const z = Math.max(base.w/view.w, 5);
  const w = base.w/z, h = base.h/z;
  view = {x:m.c[0]-w/2, y:m.c[1]-h/2, w, h};
  applyView();
}

const ESTADOS = {};
CATS.forEach(c=>{ ESTADOS[norm(c.n)] = c.k; ESTADOS[c.k] = c.k; });
ESTADOS[norm('Apoyo a otros')] = 'apoio';

function parseCSV(txt){
  txt = txt.replace(/^\ufeff/, '');
  const sep = (txt.split('\n')[0].split(';').length > txt.split('\n')[0].split(',').length) ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const c = txt[i];
    if (q){
      if (c === '"'){ if (txt[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === sep){ row.push(cell); cell = ''; }
    else if (c === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function aplicarCSV(txt){
  const rows = parseCSV(txt);
  let hi = -1, col = {};
  for (let i = 0; i < Math.min(rows.length, 12); i++){
    const hs = rows[i].map(x=>norm(x));
    const c = { name: hs.findIndex(x=>x === 'concello' || x === 'municipio'),
                ine:  hs.findIndex(x=>x === 'ine'),
                est:  hs.findIndex(x=>x.includes('estado')) };
    if ((c.name >= 0 || c.ine >= 0) && c.est >= 0){ hi = i; col = c; break; }
  }
  if (hi < 0) throw new Error('a folla non ten as columnas Concello e Estado');
  const byName = {}; DATA.m.forEach(m=>byName[norm(m.n)] = m.id);
  const novo = {};
  for (let i = hi+1; i < rows.length; i++){
    const r = rows[i];
    const get = j => (j >= 0 && r[j] != null) ? String(r[j]).trim() : '';
    let id = get(col.ine).replace(/\D/g, '');
    if (id && id.length < 5) id = id.padStart(5, '0');
    if (!id || !MUN[id]) id = byName[norm(get(col.name))] || '';
    const k = ESTADOS[norm(get(col.est))];
    if (id && k) novo[id] = {s:k, t:''};
  }
  state = novo; selected = null;
  refreshAll(); renderDetail();
  return Object.keys(novo).length;
}

const reload = document.getElementById('reload');
async function cargar(){
  if (!CSV_URL){
    savedEl.textContent = 'sen ligazón';
    savedEl.title = 'Falta pegar a ligazón CSV da folla Visor na primeira liña do ficheiro.';
    return;
  }
  reload.classList.add('spin');
  savedEl.classList.remove('on');
  savedEl.textContent = 'cargando…';
  try{
    const r = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'v=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const n = aplicarCSV(await r.text());
    const t = new Date();
    savedEl.textContent = n + ' concellos · ' +
      String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    savedEl.classList.add('on');
    savedEl.title = 'Última actualización';
  }catch(e){
    savedEl.textContent = 'erro ao cargar';
    savedEl.title = 'Non se puido ler a folla publicada: ' + e.message;
  }
  reload.classList.remove('spin');
}
reload.onclick = cargar;
setInterval(cargar, 5 * 60 * 1000);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) cargar(); });

/* panel inferior: arrastrar para redimensionar, tocar para pregar */
(function(){
  const grip = document.getElementById('grip');
  const aside = document.querySelector('aside');
  const SNAPS = [42, 0.44, 0.85];   // px fixos ou fracción da altura da xanela
  const px = v => v <= 1 ? v * window.innerHeight : v;
  let snap = 1, drag = null;
  const apply = v => aside.style.setProperty('--sheet', Math.round(v) + 'px');
  grip.addEventListener('pointerdown', ev=>{
    drag = {y: ev.clientY, h: aside.getBoundingClientRect().height, moved: false};
    try { grip.setPointerCapture(ev.pointerId); } catch(e) {}
    ev.preventDefault();
  });
  grip.addEventListener('pointermove', ev=>{
    if (!drag) return;
    const dy = drag.y - ev.clientY;
    if (Math.abs(dy) > 4) drag.moved = true;
    apply(Math.max(42, Math.min(window.innerHeight*0.88, drag.h + dy)));
  });
  const end = ()=>{
    if (drag && !drag.moved){ snap = (snap+1) % SNAPS.length; apply(px(SNAPS[snap])); }
    drag = null;
  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
})();

renderList();
renderDetail();
cargar();

if (typeof ResizeObserver === 'function'){

}
